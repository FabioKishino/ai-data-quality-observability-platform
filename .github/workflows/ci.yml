name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,pipeline,transform]'

      - name: Lint
        run: ruff check src tests dagster_project

      - name: Test
        run: pytest

      - name: Run bronze pipeline
        run: python -m observability_platform.pipeline --mode normal

      - name: dbt build
        run: dbt build --project-dir dbt --profiles-dir dbt
